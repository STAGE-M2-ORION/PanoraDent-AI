# Production au cabinet : HTTPS par Caddy, rien d'autre exposé.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# - Caddy écoute sur 80 et 443, redirige HTTP vers HTTPS et pose les en-têtes
#   de sécurité (caddy/Caddyfile). Certificat émis par son autorité interne :
#   installer son certificat racine sur les postes (README, « HTTPS au cabinet »).
# - Aucun autre port n'est publié sur l'hôte : base, stockage, inférence,
#   backend et nginx ne sont joignables que par le réseau Docker.
# - PANORADENT_HOTE : nom sous lequel les postes joignent le serveur
#   (ex. panoradent.cabinet.lan, déclaré dans le DNS ou le fichier hosts) ;
#   APP_URL, GOOGLE_REDIRECT_URI et ALLOWED_ORIGINS doivent utiliser
#   https://<ce nom>. APP_ENV=production impose le reste (secrets, SMTP…).
services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      PANORADENT_HOTE: ${PANORADENT_HOTE:-panoradent.local}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Autorité interne et certificats : à conserver (et sauvegarder).
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    restart: unless-stopped
    ports: !reset []
  backend:
    restart: unless-stopped
    ports: !reset []
    environment:
      COOKIE_SECURE: "true"
  db:
    restart: unless-stopped
    ports: !reset []
  minio:
    restart: unless-stopped
    ports: !reset []
  inference:
    restart: unless-stopped
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
