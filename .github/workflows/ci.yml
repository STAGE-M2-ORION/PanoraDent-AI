name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference deps
        working-directory: inference
        run: pip install -r requirements.txt
      - name: Run inference tests
        working-directory: inference
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, test & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build

  e2e:
    # Parcours de connexion dans un navigateur, avec le fournisseur d'identité
    # de remplacement à la place de Google (APP_ENV=test uniquement).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (e2e mode)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health && exit 0
            sleep 3
          done
          docker compose logs backend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_ADMIN_EMAIL: admin@e2e.example.org
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results

  https:
    # Production au cabinet : Caddy (autorité interne) redirige HTTP vers
    # HTTPS et pose les en-têtes de sécurité ; rien d'autre n'est exposé.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      PANORADENT_HOTE: localhost
      CADDY_HTTP_PORT: "8080"
      CADDY_HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@v4
      - name: Start stack (production override)
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
      - name: Wait for HTTPS
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost:8443/api/v1/health && exit 0
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs caddy backend
          exit 1
      - name: Verify redirection, headers and certificate
        run: bash scripts/verifier-https.sh http://localhost:8080 https://localhost:8443
      - name: Nothing else published on the host
        run: |
          for port in 3000 5432 8000 8001 9000 9001; do
            # Ouverture TCP (curl échouerait aussi sur un port ouvert non HTTP).
            if timeout 2 bash -c "</dev/tcp/localhost/$port" 2>/dev/null; then
              echo "Port $port joignable depuis l'hôte : il ne devrait pas l'être."; exit 1
            fi
          done
