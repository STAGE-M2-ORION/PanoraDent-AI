# PanoraDent AI — orchestration locale (CPU par défaut).
# Lancer : docker compose up --build
# GPU : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panoradent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panoradent}
      POSTGRES_DB: ${POSTGRES_DB:-panoradent}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panoradent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet S3-compatible (images anonymisées + rapports PDF, chiffrés au repos).
  minio:
    # minio/minio n'est plus publié sur Docker Hub : fork communautaire compatible.
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service d'inférence IA, ISOLÉ du backend (PRD §7.1).
  # Tourne en mode "mock" tant qu'aucun modèle n'est présent dans ./inference/weights.
  inference:
    build: ./inference
    environment:
      MODEL_WEIGHTS_PATH: /weights/model.pt
      MODEL_VERSION: ${MODEL_VERSION:-mock-0.0.0}
      MODEL_STRICT: ${MODEL_STRICT:-0}
      MODEL_IMAGE_SIZE: ${MODEL_IMAGE_SIZE:-640}
      MODEL_CONF_THRESHOLD: ${MODEL_CONF_THRESHOLD:-0.25}
    volumes:
      - ./inference/weights:/weights:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panoradent}:${POSTGRES_PASSWORD:-panoradent}@db:5432/${POSTGRES_DB:-panoradent}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-panoradent}
      INFERENCE_URL: http://inference:8001
      # --- Authentification (voir README, section « Authentification ») ---
      # APP_ENV=production refuse de démarrer avec le JWT_SECRET par défaut.
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      # Administrateur initial, créé au premier démarrage s'il n'existe aucun
      # admin actif. Sans ADMIN_PASSWORD, un mot de passe est généré et affiché
      # une seule fois dans `docker compose logs backend`.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      # Injecté au build ; le proxy nginx renvoie /api vers le backend.
      VITE_API_BASE: /api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  minio_data:
