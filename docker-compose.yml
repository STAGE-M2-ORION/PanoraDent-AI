# PanoraDent AI — orchestration locale (CPU par défaut).
# Lancer : docker compose up --build
# GPU : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Variables communes au backend et au worker de la file de traitement.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panoradent}:${POSTGRES_PASSWORD:-panoradent}@db:5432/${POSTGRES_DB:-panoradent}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-panoradent}
  # URLs présignées servies par le proxy nginx du frontend (`/storage/`).
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/storage}
  INFERENCE_URL: http://inference:8001
  # --- Authentification (voir README, section « Authentification ») ---
  # Deux modes : adresse e-mail + mot de passe, et compte Google.
  # APP_ENV=production refuse de démarrer sans JWT_SECRET, client Google et SMTP.
  APP_ENV: ${APP_ENV:-development}
  JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
  # `google` ; `fake` (fournisseur de remplacement) n'est accepté qu'avec APP_ENV=test.
  IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-google}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # À déclarer EXACTEMENT dans la console Google (passe par le proxy nginx).
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/auth/google/retour}
  APP_URL: ${APP_URL:-http://localhost:3000}
  # Domaine Google Workspace autorisé ; vide = toute adresse ayant un compte.
  GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
  # Adresse de l'administrateur initial (créé par le jeu de départ, deux modes).
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  # Coût bcrypt (12 minimum en production).
  BCRYPT_COUT: ${BCRYPT_COUT:-12}
  # Limitation de débit par poste et par minute (jamais 0 en production).
  LIMITE_CONNEXION_MINUTE: ${LIMITE_CONNEXION_MINUTE:-10}
  LIMITE_OUBLI_MINUTE: ${LIMITE_OUBLI_MINUTE:-5}
  LIMITE_API_MINUTE: ${LIMITE_API_MINUTE:-600}
  # E-mails de notification (sprint 13) : délai de grâce (lue dans l'application
  # avant, elle ne part pas) et intervalle minimal entre deux e-mails, en secondes.
  NOTIF_COURRIEL_GRACE_S: ${NOTIF_COURRIEL_GRACE_S:-120}
  NOTIF_COURRIEL_INTERVALLE_S: ${NOTIF_COURRIEL_INTERVALLE_S:-300}
  # E-mails (liens de première connexion et de réinitialisation) :
  # `console` = affichés dans `docker compose logs backend` ; `smtp` = envoyés.
  COURRIEL_MODE: ${COURRIEL_MODE:-console}
  COURRIEL_EXPEDITEUR: ${COURRIEL_EXPEDITEUR:-PanoraDent AI <no-reply@panoradent.local>}
  SMTP_HOTE: ${SMTP_HOTE:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
  SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  # Alerte d'administration au-delà de ce volume (Go) dans le stockage objet.
  STOCKAGE_ALERTE_GO: ${STOCKAGE_ALERTE_GO:-50}
  # --- Assistant documentaire (sprint 9) ---
  # `ollama` : modèles locaux (service `ollama`, profil « assistant ») ;
  # `factice` : sans modèle, pour les tests (refusé en production).
  ASSISTANT_FOURNISSEUR: ${ASSISTANT_FOURNISSEUR:-ollama}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  MODELE_VECTEURS: ${MODELE_VECTEURS:-bge-m3}
  MODELE_LANGAGE: ${MODELE_LANGAGE:-qwen2.5:3b}

services:
  db:
    # PostgreSQL 16 avec l'extension pgvector (assistant documentaire, sprint 9).
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panoradent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panoradent}
      POSTGRES_DB: ${POSTGRES_DB:-panoradent}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panoradent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet S3-compatible (images anonymisées + rapports PDF, chiffrés au repos).
  minio:
    # minio/minio n'est plus publié sur Docker Hub : fork communautaire compatible.
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Service d'inférence IA, ISOLÉ du backend (PRD §7.1).
  # Tourne en mode "mock" tant qu'aucun modèle n'est présent dans ./inference/weights.
  inference:
    build: ./inference
    environment:
      MODEL_WEIGHTS_PATH: /weights/model.pt
      MODEL_VERSION: ${MODEL_VERSION:-mock-0.0.0}
      MODEL_STRICT: ${MODEL_STRICT:-0}
      MODEL_IMAGE_SIZE: ${MODEL_IMAGE_SIZE:-640}
      MODEL_CONF_THRESHOLD: ${MODEL_CONF_THRESHOLD:-0.10}
    volumes:
      - ./inference/weights:/weights:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Modèles de langage et de vectorisation de l'assistant, servis en local :
  # aucune donnée ne sort du cabinet. Profil « assistant » : l'image et les
  # modèles (plusieurs Go) ne bloquent pas le reste de la pile.
  #   docker compose --profile assistant up -d
  #   docker compose exec ollama ollama pull bge-m3
  #   docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["assistant"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_started
    ports:
      - "8000:8000"

  # File de traitement : prend les analyses « en file », interroge le modèle,
  # enregistre les détections. Processus séparé du serveur web ; reprend au
  # démarrage les analyses restées « en cours ».
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_started
      # Les migrations sont appliquées au démarrage du backend.
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    # Le proxy nginx renvoie /api/ vers le backend : même origine, cookies de session inclus.
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
  minio_data:
  ollama_data:
