server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En production, Caddy (docker-compose.prod.yml) termine HTTPS devant nginx
    # et transmet l'adresse du poste dans X-Real-IP : nginx la reprend pour les
    # requêtes venues du réseau Docker, afin que le journal de connexion garde
    # l'adresse réelle et non celle de Caddy.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # Notifications en temps réel (sprint 13) : passage au WebSocket. Host avec
    # son port ($http_host) : le backend compare l'origine de la page à l'hôte
    # appelé, pour qu'aucun autre site ne s'abonne avec les cookies du praticien.
    # Le serveur envoie un message toutes les 30 s : une heure de silence, c'est
    # une connexion morte.
    location = /api/v1/moi/notifications/flux {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # API sur la MÊME origine que l'application : les cookies de session
    # (httpOnly, SameSite) sont posés et renvoyés sans configuration CORS.
    # Les redirections du parcours Google (302) traversent le proxy telles quelles.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Adresse du client pour le journal de connexion (écrase toute valeur reçue).
        proxy_set_header X-Real-IP $remote_addr;
        # Import : 20 Mo par radiographie, plus le formulaire autour (le backend
        # revérifie). Au-delà, nginx refuse avant même de transmettre.
        client_max_body_size 21m;
        # Assistant (sprint 10) : réponse au fil de l'eau. Le backend envoie
        # « X-Accel-Buffering: no », nginx relaie donc chaque événement sans le
        # retenir ; sur processeur, le premier mot peut tarder : 5 min de délai.
        proxy_read_timeout 300s;
    }

    # Images et rapports : URLs présignées MinIO, relayées sans être exposées.
    # La signature v4 couvre l'en-tête Host : il doit rester `minio:9000`.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    location / {
        # `$uri.html` est indispensable : l'export statique de Next produit
        # `analyse.html` et `design-system.html`, et non `analyse/index.html`.
        # Sans cette étape, un accès direct à ces routes retomberait sur
        # `/`, qui ne fait qu'aiguiller selon la session.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
