server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    location / {
        # `$uri.html` est indispensable : l'export statique de Next produit
        # `design-system.html`, et non `design-system/index.html`. Sans cette
        # étape, un accès direct à /design-system retomberait sur l'accueil.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
