server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API sur la MÊME origine que l'application : les cookies de session
    # (httpOnly, SameSite) sont posés et renvoyés sans configuration CORS.
    # Les redirections du parcours Google (302) traversent le proxy telles quelles.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Adresse du client pour le journal de connexion (écrase toute valeur reçue).
        proxy_set_header X-Real-IP $remote_addr;
        # Import : 20 Mo par radiographie, plus le formulaire autour (le backend
        # revérifie). Au-delà, nginx refuse avant même de transmettre.
        client_max_body_size 21m;
    }

    # Images et rapports : URLs présignées MinIO, relayées sans être exposées.
    # La signature v4 couvre l'en-tête Host : il doit rester `minio:9000`.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
    }

    location / {
        # `$uri.html` est indispensable : l'export statique de Next produit
        # `analyse.html` et `design-system.html`, et non `analyse/index.html`.
        # Sans cette étape, un accès direct à ces routes retomberait sur
        # `/`, qui ne fait qu'aiguiller selon la session.
        try_files $uri $uri.html $uri/ /index.html;
    }
}
